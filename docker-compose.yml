services:
  # PostgreSQL is retained for long-term chat and hand history only.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: texas_poker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    image: ${TEXAS_POKER_SERVER_IMAGE:-ghcr.io/ykelit/texas-poker-server:latest}
    pull_policy: always
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      CLIENT_ORIGIN: https://poker.games.zyyk.fun
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/texas_poker
      ROOM_REDIS_HOST: games-room-redis
      ROOM_REDIS_PASSWORD_FILE: /run/secrets/room_redis_password
    secrets:
      - room_redis_password
    depends_on:
      - postgres
    expose:
      - "3001"
    networks:
      default:
      games-internal:
        aliases:
          - texas-poker-server

  web:
    image: ${TEXAS_POKER_WEB_IMAGE:-ghcr.io/ykelit/texas-poker-web:latest}
    pull_policy: always
    environment:
      VITE_SERVER_ORIGIN: ${VITE_SERVER_ORIGIN:-http://server:3001}
      VITE_SOCKET_ORIGIN: ${VITE_SOCKET_ORIGIN:-}
    depends_on:
      - server
    expose:
      - "5173"
    networks:
      default:
      games-internal:
        aliases:
          - texas-poker-web

volumes:
  postgres-data:

networks:
  games-internal:
    name: ${GAMES_INTERNAL_NETWORK:-games-internal}
    external: true

secrets:
  room_redis_password:
    file: ${ROOM_REDIS_PASSWORD_FILE_HOST:-./secrets/room_redis_password}
